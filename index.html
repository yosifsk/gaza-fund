<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Emergency Fund Campaign</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:#f3f4f6;
color:#111;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.header{
background:white;
padding:15px;
border-radius:12px;
display:flex;
justify-content:space-between;
}

.badge{
background:#00b964;
color:white;
padding:5px 10px;
border-radius:20px;
font-size:12px;
}

.cover{
margin-top:15px;
border-radius:12px;
overflow:hidden;
position:relative;
}

.cover img{width:100%;height:250px;object-fit:cover;}

.cover-text{
position:absolute;
bottom:0;
width:100%;
padding:15px;
color:white;
background:linear-gradient(to top, rgba(0,0,0,0.7), transparent);
}

.grid{
display:grid;
grid-template-columns:2fr 1fr;
gap:15px;
margin-top:15px;
}

@media(max-width:800px){
.grid{grid-template-columns:1fr;}
}

.card{
background:white;
padding:15px;
border-radius:12px;
margin-top:15px;
}

.progress{
height:10px;
background:#ddd;
border-radius:50px;
overflow:hidden;
}

.bar{
height:10px;
background:#00b964;
width:0%;
}

button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.donate{background:#00b964;color:white;}
.admin{background:#111;color:white;}
.copy{background:#222;color:white;}

input,textarea{
width:100%;
padding:10px;
margin-top:5px;
border-radius:8px;
border:1px solid #ddd;
}

.comment{
border-bottom:1px solid #eee;
padding:8px 0;
}
</style>
</head>

<body>

<div class="container">

<!-- HEADER -->
<div class="header">
<strong>Emergency Fund Campaign</strong>
<span class="badge">Verified Story</span>
</div>

<!-- COVER -->
<div class="cover">
<img src="cover.jpg">
<div class="cover-text">
<h1>Help Rebuild Life</h1>
</div>
</div>

<!-- FUND -->
<div class="card">
<h2>💚 Fund Progress</h2>

<p id="stats"></p>
<div class="progress"><div class="bar" id="bar"></div></div>

<button class="donate" onclick="addDonation()">Simulate Donation +$10</button>
</div>

<!-- STORY -->
<div class="card">
<h2>📖 Story</h2>
<p>We are a family affected by war seeking support for survival and rebuilding.</p>
</div>

<!-- COMMENTS -->
<div class="card">
<h2>💬 Comments</h2>

<div id="comments"></div>

<input id="name" placeholder="Name">
<input id="email" placeholder="Email (private)">
<textarea id="text" placeholder="Comment"></textarea>

<button onclick="addComment()">Post Comment</button>
</div>

<!-- ADMIN -->
<div class="card">
<h2>🔐 Admin Dashboard</h2>

<input id="goal" placeholder="Set Goal">
<input id="raised" placeholder="Set Raised">

<button class="admin" onclick="updateFund()">Update Fund</button>
<button class="admin" onclick="resetData()">Reset All</button>
</div>

</div>

<script>
/* -------------------------
   DATABASE (LOCAL STORAGE)
--------------------------*/

let fund = JSON.parse(localStorage.getItem("fund")) || {
  goal: 5000,
  raised: 120
};

let comments = JSON.parse(localStorage.getItem("comments")) || [];

/* -------------------------
   UPDATE FUND UI
--------------------------*/

function renderFund(){
  document.getElementById("stats").innerText =
    `$${fund.raised} raised of $${fund.goal}`;

  let percent = (fund.raised / fund.goal) * 100;
  document.getElementById("bar").style.width = percent + "%";

  localStorage.setItem("fund", JSON.stringify(fund));
}

renderFund();

/* -------------------------
   DONATION SIMULATION
--------------------------*/

function addDonation(){
  fund.raised += 10;
  renderFund();
}

/* -------------------------
   COMMENTS SYSTEM
--------------------------*/

function renderComments(){
  let html = "";

  comments.forEach(c => {
    html += `
      <div class="comment">
        <b>${c.name}</b>
        <p>${c.text}</p>
      </div>
    `;
  });

  document.getElementById("comments").innerHTML = html;
}

function addComment(){
  let c = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value, // private only
    text: document.getElementById("text").value,
    time: Date.now()
  };

  comments.push(c);
  localStorage.setItem("comments", JSON.stringify(comments));

  renderComments();
}

/* -------------------------
   ADMIN CONTROLS
--------------------------*/

function updateFund(){
  fund.goal = Number(document.getElementById("goal").value);
  fund.raised = Number(document.getElementById("raised").value);
  renderFund();
}

function resetData(){
  localStorage.clear();
  location.reload();
}

/* INIT */
renderComments();
</script>

</body>
</html>
