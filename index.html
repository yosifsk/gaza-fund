<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Support Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;margin:0;background:#f6f7f9}
.container{max-width:800px;margin:auto;padding:20px}
.card{background:white;padding:15px;margin-top:15px;border-radius:12px}
.update{border-left:4px solid #16a34a;padding-left:10px;margin-top:10px}
.wallet{background:#f0fdf4;padding:10px;border-radius:8px}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h2>My Support Campaign</h2>
<p>Computer Engineer from Gaza</p>
</div>

<div class="card">
<h3>Updates</h3>
<div id="updates">Loading...</div>
</div>

<div class="card">
<h3>Wallets</h3>
<div class="wallet">USDT: XXX</div>
<div class="wallet">BTC: XXX</div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "XXX",
  authDomain: "XXX",
  projectId: "XXX",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function load(){
const snap = await getDocs(collection(db,"updates"));

let html = "";
snap.forEach(d=>{
html += `<div class="update">• ${d.data().text}</div>`;
});

document.getElementById("updates").innerHTML = html;
}

load();
</script>

</body>
</html>
