<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Emergency Fund</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Arial;margin:0;background:#f4f4f4}
.container{max-width:800px;margin:auto;padding:20px}

.card{background:#fff;padding:15px;border-radius:10px;margin-top:15px}

.progress{height:10px;background:#ddd;border-radius:20px;overflow:hidden}
.bar{height:10px;background:#00b964;width:0%}

.comment{border-bottom:1px solid #eee;padding:10px 0}

button{padding:10px;width:100%;margin-top:10px;border:none;border-radius:8px}
.donate{background:#00b964;color:#fff}
</style>
</head>

<body>

<div class="container">

<h2>💚 Gaza Emergency Fund</h2>

<!-- FUND -->
<div class="card">
<h3>Fund Progress</h3>
<p id="stats"></p>
<div class="progress"><div class="bar" id="bar"></div></div>
</div>

<!-- STORY -->
<div class="card">
<h3>Story</h3>
<p>We are a family affected by war seeking support.</p>
</div>

<!-- COMMENTS -->
<div class="card">
<h3>💬 Comments</h3>

<div id="comments"></div>

<input id="name" placeholder="Name">
<input id="email" placeholder="Email (private)">
<textarea id="text" placeholder="Comment"></textarea>

<button class="donate" onclick="addComment()">Post Comment</button>
</div>

</div>

<script src="app.js"></script>
</body>
</html>
